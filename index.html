const el=React.createElement;
const PW="sunset2026";
const grad="linear-gradient(135deg,#f4694b 0%,#e8506a 40%,#b05898 70%,#7048a0 100%)";

const RATE_30=6.48;
const RATE_15=5.79;

function stor(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v));}catch{return null;}}
function fmt(n){return n.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0});}
function fmtD(n){return"$"+fmt(Math.round(n));}
function calcPI(principal,annualRate,years){
  if(principal<=0||annualRate<=0)return 0;
  const r=annualRate/100/12,n=years*12;
  return principal*(r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1);
}

const STEPS=[
  {title:"Confirm income eligibility",badge:"Do first",bc:{bg:"#fad4cb",color:"#c0391a"},desc:"Your $95k income (~112% AMI) = $40,000 Zone A grant. All adults 18+ household income counts. Max to qualify: 150% AMI ($127,650 single)."},
  {title:"Complete HUD homebuyer education",badge:"Required",bc:{bg:"#fef0d4",color:"#8a5a10"},desc:"Must complete before applying. Find a HUD-certified counselor (NHS Chicago). You'll get a certificate needed for the application.",link:{label:"Find HUD counselors",url:"https://www.hud.gov/program_offices/housing/sfh/hcc/hcs.cfm"}},
  {title:"Get mortgage pre-approval",badge:"Required",bc:{bg:"#fef0d4",color:"#8a5a10"},desc:"Pre-approval letter required. At $95k you qualify comfortably for ~$188k. TRP Lending works directly with HomeGrown.",link:{label:"TRP Lending: (312) 666-1323",url:"tel:+13126661323"}},
  {title:"Gather income documents",badge:"Required",bc:{bg:"#fef0d4",color:"#8a5a10"},desc:"All household adults 18+: last 3 pay stubs · 2 years federal tax returns + schedules · 2 years W-2s · Social Security/pension statements."},
  {title:"Find a property & verify Zone A",badge:"Critical",bc:{bg:"#fce8ec",color:"#b02040"},desc:"Eligible: condo, single-family, townhome, 2-flat. No new construction. Run every address through the Zone Tool before an offer.",link:{label:"Open Zone A/B Lookup Tool",url:"https://chicago.maps.arcgis.com/apps/instant/lookup/index.html?appid=f7b2382970c2412686a7dcab6a9c908c"}},
  {title:"Sign a purchase contract",desc:"Fully executed purchase contract required to submit. $40k stays within 25% cap across $180k–$235k. Must occupy 5+ years."},
  {title:"Submit application — act fast",badge:"First-come",bc:{bg:"#fad4cb",color:"#c0391a"},desc:"$21M fund, ~300–400 buyers. Applications opened June 8, 2026. Apply through TRP Lending or Neighborhood Lending Services.",link:{label:"Apply — The Resurrection Project",url:"https://resurrectionproject.tfaforms.net/f/homegrown"},link2:{label:"chicago.gov/homegrown",url:"https://www.chicago.gov/homegrown"}},
  {title:"Have $2,300 personal contribution ready",badge:"Required",bc:{bg:"#fef0d4",color:"#8a5a10"},desc:"At $230k, must contribute 1% ($2,300) from personal funds — not a gift or loan. Required in addition to the grant."},
];

const APP_LINKS=[
  {label:"Primary Application",name:"The Resurrection Project",desc:"TRP Lending — official HomeGrown admin",url:"https://resurrectionproject.tfaforms.net/f/homegrown"},
  {label:"Official Program Info",name:"chicago.gov/homegrown",desc:"City of Chicago Dept. of Housing",url:"https://www.chicago.gov/homegrown"},

/* ── LOCK ─────────────────────────────────────────────── */
function LockScreen({onUnlock}){
  const[pw,setPw]=useState("");const[show,setShow]=useState(false);
  const[err,setErr]=useState("");const[shake,setShake]=useState(false);
  function tryUnlock(){
    if(pw===PW)onUnlock();
    else{setErr("Incorrect password — try again.");setPw("");setShake(true);setTimeout(()=>setShake(false),500);setTimeout(()=>setErr(""),3000);}
  }
  return el("div",{style:{minHeight:"100vh",background:gDark,display:"flex",alignItems:"center",justifyContent:"center",padding:24,position:"relative",overflow:"hidden"}},
    el("div",{style:{position:"absolute",width:500,height:500,borderRadius:"50%",background:"radial-gradient(circle,rgba(244,105,75,0.2) 0%,transparent 70%)",top:"50%",left:"50%",transform:"translate(-50%,-50%)",pointerEvents:"none"}}),
    el("div",{style:{position:"relative",background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.13)",borderRadius:24,padding:"40px 28px 32px",width:"100%",maxWidth:400,textAlign:"center",animation:shake?"shake 0.45s ease":"none"}},
      el("div",{style:{fontSize:44,marginBottom:12}},"🌅"),
      el("div",{style:{fontFamily:"Georgia,serif",fontSize:26,color:"#fff",marginBottom:6}},"HomeGrown Hub"),
      el("div",{style:{fontSize:13,color:"rgba(255,255,255,0.4)",marginBottom:32}},"Your private grant & listings dashboard"),
      el("div",{style:{position:"relative",marginBottom:14}},
        el("input",{type:show?"text":"password",value:pw,onChange:e=>setPw(e.target.value),onKeyDown:e=>e.key==="Enter"&&tryUnlock(),placeholder:"Enter password",autoComplete:"off",autoCorrect:"off",autoCapitalize:"none",spellCheck:false,style:{width:"100%",padding:"16px 52px 16px 20px",background:"rgba(255,255,255,0.09)",border:"1.5px solid rgba(255,255,255,0.18)",borderRadius:12,color:"#fff",fontSize:18,letterSpacing:"0.2em",textAlign:"center",outline:"none",WebkitAppearance:"none",boxSizing:"border-box"}}),
        el("button",{onClick:()=>setShow(s=>!s),style:{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"rgba(255,255,255,0.45)",fontSize:18,cursor:"pointer",padding:4}},show?"🙈":"👁")
      ),
      el("button",{onClick:tryUnlock,style:{width:"100%",padding:16,background:grad,border:"none",borderRadius:12,color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",boxShadow:"0 8px 24px rgba(244,105,75,0.3)"}},"Unlock Dashboard"),
      err&&el("div",{style:{marginTop:12,fontSize:13,color:C.coral}},err),
      el("div",{style:{marginTop:24,fontSize:11,color:"rgba(255,255,255,0.18)",fontFamily:"monospace"}},"protected · sunset edition")
    )
  );
}

/* ── CHECKLIST ────────────────────────────────────────── */
function Checklist(){
  const[done,setDone]=useState(()=>stor("hg_cl")||[]);
  function toggle(i){const next=done.includes(i)?done.filter(x=>x!==i):[...done,i];setDone(next);stor("hg_cl",next);}
  const pct=Math.round(done.length/STEPS.length*100);
  return el("div",null,
    el("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:6}},
      el("span",{style:{fontSize:11,color:C.muted,fontFamily:"monospace"}},"Progress"),
      el("span",{style:{fontSize:11,color:C.muted,fontFamily:"monospace"}},done.length+" of "+STEPS.length)
    ),
    el("div",{style:{background:C.rule,borderRadius:100,height:5,marginBottom:20,overflow:"hidden"}},
      el("div",{style:{height:"100%",width:pct+"%",background:grad,borderRadius:100,transition:"width 0.5s"}})
    ),
    el("div",{style:{display:"flex",flexDirection:"column",gap:10}},
      STEPS.map((s,i)=>{
        const d=done.includes(i);
        return el("div",{key:i,onClick:()=>toggle(i),style:{display:"flex",gap:12,alignItems:"flex-start",background:d?"linear-gradient(135deg,#fff8f5,#ffeef4)":C.white,border:`1.5px solid ${d?"#f5c0b0":C.rule}`,borderLeft:`3.5px solid ${d?C.coral:C.rule}`,borderRadius:14,padding:14,cursor:"pointer"}},
          el("div",{style:{width:22,height:22,borderRadius:7,flexShrink:0,marginTop:1,background:d?grad:C.white,border:d?"none":"2px solid "+C.rule,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:"#fff"}},d&&"✓"),
          el("div",{style:{flex:1,minWidth:0}},
            el("div",{style:{display:"flex",flexWrap:"wrap",gap:7,alignItems:"center",marginBottom:3}},
              el("span",{style:{fontWeight:700,fontSize:13,color:d?C.coral:C.ink,textDecoration:d?"line-through":"none"}},s.title),
              s.badge&&el("span",{style:{fontFamily:"monospace",fontSize:9,letterSpacing:"0.09em",textTransform:"uppercase",padding:"2px 8px",borderRadius:100,background:s.bc.bg,color:s.bc.color,fontWeight:600}},s.badge)
            ),
            el("div",{style:{fontSize:12,color:C.muted,lineHeight:1.6}},s.desc),
            s.link&&el("a",{href:s.link.url,target:"_blank",rel:"noreferrer",onClick:e=>e.stopPropagation(),style:{display:"inline-block",marginTop:7,fontSize:11,fontWeight:700,color:C.coral,textDecoration:"none",fontFamily:"monospace"}},"→ "+s.link.label),
            s.link2&&el("a",{href:s.link2.url,target:"_blank",rel:"noreferrer",onClick:e=>e.stopPropagation(),style:{display:"inline-block",marginTop:5,marginLeft:8,fontSize:11,fontWeight:700,color:C.coral,textDecoration:"none",fontFamily:"monospace"}},"→ "+s.link2.label)
          )
        );
      })
    )
  );
}

/* ── CALCULATOR ───────────────────────────────────────── */
function Calculator({fromListing}){
  const[price,setPrice]=useState(fromListing&&fromListing.rawPrice?String(fromListing.rawPrice):"230000");
  const[grant,setGrant]=useState("40000");
  const[hoa,setHoa]=useState("425");
  const[rate30,setRate30]=useState(String(RATE_30));
  const[rate15,setRate15]=useState(String(RATE_15));
  const[taxRate,setTaxRate]=useState("1.66");
  const[term,setTerm]=useState("30");
  const[income,setIncome]=useState("95000");
  const[source,setSource]=useState(fromListing?fromListing.addr:null);

  useEffect(()=>{
    if(fromListing&&fromListing.rawPrice){setPrice(String(fromListing.rawPrice));setSource(fromListing.addr);}
  },[fromListing&&fromListing.id]);

  const p=parseFloat(price)||0;
  const g=parseFloat(grant)||0;
  const h=parseFloat(hoa)||0;
  const r30=parseFloat(rate30)||RATE_30;
  const r15=parseFloat(rate15)||RATE_15;
  const tr=parseFloat(taxRate)||1.66;
  const inc=parseFloat(income)||0;
  const loan=Math.max(0,p-g);
  const pi30=calcPI(loan,r30,30);
  const pi15=calcPI(loan,r15,15);
  const monthlyTax=(p*tr/100)/12;
  const insurance=p*0.0065/12;
  const total30=pi30+h+monthlyTax+insurance;
  const total15=pi15+h+monthlyTax+insurance;
  const totalActive=term==="30"?total30:total15;
  const piActive=term==="30"?pi30:pi15;
  const grossMonthly=inc/12;
  const dti28=grossMonthly*0.28;
  const qualifies=totalActive<=dti28;
  const qualifiesStretched=totalActive<=(grossMonthly*0.36);
  const incNeeded=(totalActive/0.28)*12;
  const pctIncome=grossMonthly>0?Math.round(totalActive/grossMonthly*100):0;
  const barColor=pctIncome<=28?"#1a6640":pctIncome<=36?"#e8961e":"#c0391a";
  const totalInterest30=pi30*30*12-loan;
  const totalInterest15=pi15*15*12-loan;

  function Field({label,value,onChange,prefix,suffix}){
    return el("div",{style:{marginBottom:12}},
      el("label",{style:{fontSize:10,color:C.muted,fontFamily:"monospace",letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:5}},label),
      el("div",{style:{position:"relative",display:"flex",alignItems:"center"}},
        prefix&&el("span",{style:{position:"absolute",left:12,fontSize:14,color:C.muted,pointerEvents:"none"}},"$"),
        el("input",{value,onChange:ev=>onChange(ev.target.value),type:"number",inputMode:"decimal",style:{width:"100%",padding:`11px 12px 11px ${prefix?"28px":"12px"}`,border:`1.5px solid ${C.rule}`,borderRadius:10,fontSize:14,color:C.ink,background:C.white,outline:"none",boxSizing:"border-box",WebkitAppearance:"none"}}),
        suffix&&el("span",{style:{position:"absolute",right:12,fontSize:12,color:C.muted,pointerEvents:"none"}},suffix)
      )
    );
  }

  return el("div",{style:{animation:"slideIn 0.2s ease"}},
    source&&el("div",{style:{display:"flex",alignItems:"center",gap:8,background:"linear-gradient(135deg,#fff0ec,#ffeef4)",border:`1.5px solid ${C.coralLt}`,borderRadius:12,padding:"10px 14px",marginBottom:16,fontSize:12,color:C.coral,fontWeight:700}},"📍 "+source),

    el("div",{style:{background:gDark,borderRadius:14,padding:"14px 16px",marginBottom:18,position:"relative",overflow:"hidden"}},
      el("div",{style:{position:"absolute",inset:0,background:"radial-gradient(ellipse 80% 100% at 100% 100%,rgba(244,105,75,0.18) 0%,transparent 55%)",pointerEvents:"none"}}),
      el("div",{style:{fontFamily:"monospace",fontSize:9,letterSpacing:"0.14em",textTransform:"uppercase",color:"rgba(255,255,255,0.3)",marginBottom:10,position:"relative"}},"Live rates · Freddie Mac June 4, 2026"),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,position:"relative"}},
        el("div",null,
          el("div",{style:{fontSize:9,fontFamily:"monospace",color:"rgba(255,255,255,0.3)",marginBottom:3,textTransform:"uppercase",letterSpacing:"0.1em"}},"30-yr fixed"),
          el("div",{style:{fontFamily:"Georgia,serif",fontSize:22,fontStyle:"italic",background:grad,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},RATE_30+"%")
        ),
        el("div",null,
          el("div",{style:{fontSize:9,fontFamily:"monospace",color:"rgba(255,255,255,0.3)",marginBottom:3,textTransform:"uppercase",letterSpacing:"0.1em"}},"15-yr fixed"),
          el("div",{style:{fontFamily:"Georgia,serif",fontSize:22,fontStyle:"italic",background:grad,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},RATE_15+"%")
        )
      )
    ),

    el("div",{style:{background:C.white,border:`1.5px solid ${C.rule}`,borderRadius:16,padding:"18px 16px",marginBottom:16}},
      el("div",{style:{fontFamily:"monospace",fontSize:10,letterSpacing:"0.15em",textTransform:"uppercase",color:C.muted,marginBottom:14}},"Your numbers"),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:0}},
        el("div",{style:{paddingRight:8}},el(Field,{label:"Purchase price",value:price,onChange:setPrice,prefix:true})),
        el("div",{style:{paddingLeft:8}},el(Field,{label:"Grant / down payment",value:grant,onChange:setGrant,prefix:true}))
      ),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:0}},
        el("div",{style:{paddingRight:8}},el(Field,{label:"Monthly HOA",value:hoa,onChange:setHoa,prefix:true})),
        el("div",{style:{paddingLeft:8}},el(Field,{label:"Annual income",value:income,onChange:setIncome,prefix:true}))
      ),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:0}},
        el("div",{style:{paddingRight:6}},el(Field,{label:"30yr rate",value:rate30,onChange:setRate30,suffix:"%"})),
        el("div",{style:{paddingLeft:3,paddingRight:3}},el(Field,{label:"15yr rate",value:rate15,onChange:setRate15,suffix:"%"})),
        el("div",{style:{paddingLeft:6}},el(Field,{label:"Tax rate",value:taxRate,onChange:setTaxRate,suffix:"%"}))
      ),
      el("div",{style:{marginTop:4}},
        el("label",{style:{fontSize:10,color:C.muted,fontFamily:"monospace",letterSpacing:"0.12em",textTransform:"uppercase",display:"block",marginBottom:8}},"Loan term"),
        el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
          ["30","15"].map(t=>el("button",{key:t,onClick:()=>setTerm(t),style:{padding:10,borderRadius:10,border:`1.5px solid ${term===t?C.coral:C.rule}`,background:term===t?"linear-gradient(135deg,#fff0ec,#ffeef4)":C.white,color:term===t?C.coral:C.muted,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}},t+"-year"))
        )
      )
    ),

    el("div",{style:{background:gDark,borderRadius:16,padding:"20px 18px",marginBottom:16,position:"relative",overflow:"hidden"}},
      el("div",{style:{position:"absolute",inset:0,background:"radial-gradient(ellipse 80% 80% at 90% 110%,rgba(244,105,75,0.22) 0%,transparent 55%)",pointerEvents:"none"}}),
      el("div",{style:{fontFamily:"monospace",fontSize:9,letterSpacing:"0.14em",textTransform:"uppercase",color:"rgba(255,255,255,0.3)",marginBottom:16,position:"relative"}},term+"-year breakdown · "+fmtD(loan)+" loan"),
      el("div",{style:{display:"flex",flexDirection:"column",gap:10,position:"relative"}},
        [
          {label:"Principal & Interest",val:piActive,accent:true},
          {label:"Property Tax (~"+taxRate+"%/yr)",val:monthlyTax},
          {label:"HOA (Chicago avg 2026)",val:h},
          {label:"Condo Insurance (~0.65%/yr)",val:insurance},
        ].map(row=>el("div",{key:row.label,style:{display:"flex",justifyContent:"space-between",alignItems:"center",paddingBottom:10,borderBottom:"1px solid rgba(255,255,255,0.06)"}},
          el("span",{style:{fontSize:12,color:row.accent?"rgba(255,255,255,0.8)":"rgba(255,255,255,0.45)"}},row.label),
          el("span",{style:{fontFamily:"Georgia,serif",fontSize:row.accent?18:14,fontStyle:"italic",color:row.accent?"transparent":"rgba(255,255,255,0.6)",background:row.accent?grad:"none",WebkitBackgroundClip:row.accent?"text":"unset",WebkitTextFillColor:row.accent?"transparent":"rgba(255,255,255,0.6)"}},fmtD(row.val))
        )),
        el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:4}},
          el("span",{style:{fontSize:14,fontWeight:700,color:"#fff"}},"Total Monthly"),
          el("span",{style:{fontFamily:"Georgia,serif",fontSize:26,fontStyle:"italic",background:grad,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},fmtD(totalActive))
        )
      )
    ),

    el("div",{style:{background:C.white,border:`1.5px solid ${C.rule}`,borderRadius:16,padding:"16px",marginBottom:16}},
      el("div",{style:{fontFamily:"monospace",fontSize:10,letterSpacing:"0.15em",textTransform:"uppercase",color:C.muted,marginBottom:14}},"30-yr vs 15-yr comparison"),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}},
        [{t:"30",pi:pi30,total:total30,rate:r30,interest:totalInterest30},{t:"15",pi:pi15,total:total15,rate:r15,interest:totalInterest15}].map(col=>
          el("div",{key:col.t,onClick:()=>setTerm(col.t),style:{background:term===col.t?"linear-gradient(135deg,#fff0ec,#ffeef4)":"#fafafa",border:`1.5px solid ${term===col.t?C.coralLt:C.rule}`,borderRadius:12,padding:"14px 12px",cursor:"pointer"}},
            el("div",{style:{fontFamily:"monospace",fontSize:9,letterSpacing:"0.12em",textTransform:"uppercase",color:C.muted,marginBottom:6}},col.t+"-yr · "+col.rate+"%"),
            el("div",{style:{fontFamily:"Georgia,serif",fontSize:18,fontStyle:"italic",background:grad,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",marginBottom:4}},fmtD(col.total)+"/mo"),
            el("div",{style:{fontSize:11,color:C.muted}},"P&I: "+fmtD(col.pi)),
            el("div",{style:{fontSize:11,color:C.muted,marginTop:2}},"Total interest: "+fmtD(Math.max(0,col.interest)))
          )
        )
      ),

/* ── MY WATCHLIST ─────────────────────────────────────── */
function MyListings({onCalc}){
  const[listings,setListings]=useState(()=>stor("hg_watch")||SEED);
  const[showForm,setShowForm]=useState(false);
  const[form,setForm]=useState({addr:"",price:"",rawPrice:"",url:"",zoneA:"unverified"});
  const[filter,setFilter]=useState("all");
  function save(next){setListings(next);stor("hg_watch",next);}
  function addListing(){if(!form.addr.trim())return;save([{id:"u"+Date.now(),...form,rawPrice:parseFloat(form.rawPrice)||0,fav:false},...listings]);setForm({addr:"",price:"",rawPrice:"",url:"",zoneA:"unverified"});setShowForm(false);}
  function toggleFav(id){save(listings.map(l=>l.id===id?{...l,fav:!l.fav}:l));}
  function toggleZone(id){save(listings.map(l=>{if(l.id!==id)return l;const nxt=l.zoneA==="unverified"?"verified":l.zoneA==="verified"?"not-zone-a":"unverified";return{...l,zoneA:nxt};}));}
  function remove(id){save(listings.filter(l=>l.id!==id));}
  const zoneLabel={verified:{label:"Zone A ✓",bg:C.greenLt,color:C.green},unverified:{label:"Verify Zone A",bg:"#fff0ec",color:C.coral},"not-zone-a":{label:"Not Zone A",bg:"#fce8ec",color:"#b02040"}};
  const shown=filter==="fav"?listings.filter(l=>l.fav):listings;
  return el("div",null,
    el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
      el("div",{style:{display:"flex",gap:8}},
        el("button",{onClick:()=>setFilter("all"),style:{fontSize:11,fontWeight:700,padding:"6px 14px",borderRadius:100,border:`1.5px solid ${filter==="all"?C.coral:C.rule}`,background:filter==="all"?"linear-gradient(135deg,#fff0ec,#ffeef4)":C.white,color:filter==="all"?C.coral:C.muted,cursor:"pointer",fontFamily:"inherit"}},"All ("+listings.length+")"),
        el("button",{onClick:()=>setFilter("fav"),style:{fontSize:11,fontWeight:700,padding:"6px 14px",borderRadius:100,border:`1.5px solid ${filter==="fav"?C.coral:C.rule}`,background:filter==="fav"?"linear-gradient(135deg,#fff0ec,#ffeef4)":C.white,color:filter==="fav"?C.coral:C.muted,cursor:"pointer",fontFamily:"inherit"}},"⭐ ("+listings.filter(l=>l.fav).length+")")
      ),
      el("button",{onClick:()=>setShowForm(s=>!s),style:{fontSize:12,fontWeight:700,padding:"8px 16px",borderRadius:100,background:showForm?"#f0ddd8":grad,color:showForm?C.muted:"#fff",border:"none",cursor:"pointer",fontFamily:"inherit"}},showForm?"Cancel":"+ Add")
    ),
    showForm&&el("div",{style:{background:"linear-gradient(135deg,#fff8f5,#ffeef4)",border:`1.5px solid ${C.coralLt}`,borderRadius:16,padding:"18px 16px",marginBottom:16,animation:"slideIn 0.2s ease"}},
      el("div",{style:{fontFamily:"monospace",fontSize:10,letterSpacing:"0.15em",textTransform:"uppercase",color:C.muted,marginBottom:14}},"Add a listing to watch"),
      el("div",{style:{marginBottom:10}},
        el("label",{style:{fontSize:10,color:C.muted,fontFamily:"monospace",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.1em"}},"Address *"),
        el("input",{value:form.addr,onChange:e=>setForm(f=>({...f,addr:e.target.value})),placeholder:"e.g. 3200 S King Dr #4B",style:{width:"100%",padding:"11px 14px",border:`1.5px solid ${C.rule}`,borderRadius:10,fontSize:13,color:C.ink,background:C.white,outline:"none",boxSizing:"border-box"}})
      ),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}},
        el("div",null,
          el("label",{style:{fontSize:10,color:C.muted,fontFamily:"monospace",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.1em"}},"Display price"),
          el("input",{value:form.price,onChange:e=>setForm(f=>({...f,price:e.target.value})),placeholder:"$215,000",style:{width:"100%",padding:"11px 12px",border:`1.5px solid ${C.rule}`,borderRadius:10,fontSize:13,color:C.ink,background:C.white,outline:"none",boxSizing:"border-box"}})
        ),
        el("div",null,
          el("label",{style:{fontSize:10,color:C.muted,fontFamily:"monospace",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.1em"}},"Price (numbers only)"),
          el("input",{value:form.rawPrice,onChange:e=>setForm(f=>({...f,rawPrice:e.target.value})),placeholder:"215000",type:"number",inputMode:"numeric",style:{width:"100%",padding:"11px 12px",border:`1.5px solid ${C.rule}`,borderRadius:10,fontSize:13,color:C.ink,background:C.white,outline:"none",boxSizing:"border-box",WebkitAppearance:"none"}})
        )
      ),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}},
        el("div",null,
          el("label",{style:{fontSize:10,color:C.muted,fontFamily:"monospace",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.1em"}},"Zone A status"),
          el("select",{value:form.zoneA,onChange:e=>setForm(f=>({...f,zoneA:e.target.value})),style:{width:"100%",padding:"11px 12px",border:`1.5px solid ${C.rule}`,borderRadius:10,fontSize:12,color:C.ink,background:C.white,outline:"none",boxSizing:"border-box",WebkitAppearance:"none"}},
            el("option",{value:"unverified"},"Unverified"),
            el("option",{value:"verified"},"Zone A ✓"),
            el("option",{value:"not-zone-a"},"Not Zone A")
          )
        ),
        el("div",null,
          el("label",{style:{fontSize:10,color:C.muted,fontFamily:"monospace",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:"0.1em"}},"Listing URL"),
          el("input",{value:form.url,onChange:e=>setForm(f=>({...f,url:e.target.value})),placeholder:"https://...",style:{width:"100%",padding:"11px 12px",border:`1.5px solid ${C.rule}`,borderRadius:10,fontSize:12,color:C.ink,background:C.white,outline:"none",boxSizing:"border-box"}})
        )
      ),
      el("button",{onClick:addListing,style:{width:"100%",padding:13,background:grad,border:"none",borderRadius:12,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}},"Save to Watchlist")
    ),
    shown.length===0&&el("div",{style:{textAlign:"center",padding:"40px 20px",color:C.muted,fontSize:13}},
      el("div",{style:{fontSize:36,marginBottom:12}},"🏠"),
      filter==="fav"?"No favorites yet — tap ⭐ on a listing.":"No listings yet — tap + Add."
    ),
    el("div",{style:{display:"flex",flexDirection:"column",gap:10}},
      shown.map(l=>{
        const zl=zoneLabel[l.zoneA]||zoneLabel.unverified;
        return el("div",{key:l.id,style:{background:C.white,border:`1.5px solid ${l.fav?"#f5c0b0":C.rule}`,borderLeft:`3.5px solid ${l.fav?C.coral:C.rule}`,borderRadius:14,padding:14,animation:"slideIn 0.2s ease"}},
          el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}},
            el("div",{style:{flex:1,minWidth:0,paddingRight:8}},
              el("div",{style:{fontWeight:700,fontSize:13,color:C.ink,marginBottom:2,lineHeight:1.3}},l.addr),
              l.price&&el("div",{style:{fontFamily:"Georgia,serif",fontSize:15,fontStyle:"italic",background:grad,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},l.price)
            ),
            el("button",{onClick:()=>toggleFav(l.id),style:{background:"none",border:"none",fontSize:22,cursor:"pointer",padding:4,lineHeight:1,flexShrink:0}},l.fav?"⭐":"☆")
          ),
          el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}},
            el("button",{onClick:()=>toggleZone(l.id),style:{fontFamily:"monospace",fontSize:10,padding:"4px 10px",borderRadius:100,background:zl.bg,color:zl.color,border:"none",cursor:"pointer",fontWeight:600}},zl.label),
            el("div",{style:{display:"flex",gap:8,alignItems:"center"}},
              l.rawPrice>0&&el("button",{onClick:()=>onCalc(l),style:{fontFamily:"monospace",fontSize:10,fontWeight:700,color:"#7048a0",background:"#f3eeff",border:"1px solid #d4c0f0",borderRadius:100,padding:"4px 10px",cursor:"pointer"}},"📊 Calc"),
              l.url&&el("a",{href:l.url,target:"_blank",rel:"noreferrer",style:{fontFamily:"monospace",fontSize:10,fontWeight:700,color:C.coral,textDecoration:"none",padding:"4px 10px",border:`1px solid ${C.coralLt}`,borderRadius:100,background:"#fff0ec"}},"View ↗"),
              el("button",{onClick:()=>remove(l.id),style:{fontFamily:"monospace",fontSize:10,color:"#c0b0b0",background:"none",border:"1px solid #f0e0e0",borderRadius:100,padding:"4px 10px",cursor:"pointer",fontFamily:"inherit"}},"Remove")
            )
          )
        );
      })
    ),
    listings.length>0&&el("div",{style:{marginTop:14,padding:"10px 14px",background:"linear-gradient(135deg,#fff8f5,#fff0f8)",border:`1.5px solid ${C.rule}`,borderRadius:12,fontSize:11,color:C.muted,fontFamily:"monospace",lineHeight:1.7}},
      "💡 Tap 📊 Calc on any priced listing to run the mortgage calculator. Tap the Zone A pill to update status."
    )
  );
}

      el("span",{style:{fontSize:16,flexShrink:0}},"📍"),

    APP_LINKS.map(l=>el("a",{key:l.url,href:l.url,target:"_blank",rel:"noreferrer",style:{display:"flex",flexDirection:"column",gap:4,background:C.white,border:`1.5px solid ${C.rule}`,borderRadius:14,padding:"14px 12px",textDecoration:"none"}},
      el("div",{style:{fontFamily:"monospace",fontSize:9,letterSpacing:"0.12em",textTransform:"uppercase",color:C.muted}},l.label),

      el("div",{style:{fontSize:11,color:C.muted,lineHeight:1.4}},l.desc),

}

  const tabs=[{id:"checklist",label:"Checklist"},{id:"watch",label:"Watchlist"},{id:"calc",label:"Calculator"},{id:"search",label:"Search"},{id:"links",label:"Apply"}];

    {label:"Target Price",value:"≤$230k",sub:"17.4% — within cap ✓"},

      el("div",{style:{position:"absolute",inset:0,backgroundImage:"linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px)",backgroundSize:"36px 36px",pointerEvents:"none"}}),
      el("div",{style:{position:"relative",padding:"28px 18px 16px"}},
        el("div",{style:{fontFamily:"monospace",fontSize:9,letterSpacing:"0.18em",textTransform:"uppercase",color:C.peach,marginBottom:8,opacity:0.8}},"City of Chicago · HomeGrown 2026"),
        el("div",{style:{fontFamily:"Georgia,serif",fontSize:26,lineHeight:1.1,color:"#fff",marginBottom:14}},
          "Your path to ",el("span",{style:{fontStyle:"italic",background:grad,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}},"owning in Chicago")

        el("div",{style:{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:14,padding:14,position:"relative",overflow:"hidden"}},
          el("div",{style:{position:"absolute",inset:0,background:"radial-gradient(ellipse 80% 80% at 90% 110%,rgba(244,105,75,0.18) 0%,transparent 55%)",pointerEvents:"none"}}),
          el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,position:"relative"}},
            stats.map(s=>el("div",{key:s.label},
              el("div",{style:{fontFamily:"monospace",fontSize:8,letterSpacing:"0.12em",textTransform:"uppercase",color:"rgba(255,255,255,0.3)",marginBottom:4}},s.label),

      el("div",{style:{display:"flex",borderTop:"1px solid rgba(255,255,255,0.08)",overflowX:"auto",WebkitOverflowScrolling:"touch"}},

/* ── ROOT ─────────────────────────────────────────────── */
function Root(){
  const[unlocked,setUnlocked]=useState(false);
  useEffect(()=>{try{if(sessionStorage.getItem("hg_unlocked")==="1")setUnlocked(true)}catch{}});
  function handleUnlock(){try{sessionStorage.setItem("hg_unlocked","1")}catch{};setUnlocked(true);}
  return unlocked?el(MainApp):el(LockScreen,{onUnlock:handleUnlock});
}
ReactDOM.createRoot(document.getElementById("root")).render(el(Root));
